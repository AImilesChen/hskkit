name: Diagnose R2 binding transport
on:
  push:
    branches: [diagnostic/cache-binding-20261113]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 77bc392d46985cd3425691358f5e8a77
    steps:
      - name: Read credential metadata and exact R2 response codes
        run: |
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          async function check(label,path,method='GET',body){
            const r=await fetch('https://api.cloudflare.com/client/v4/'+path,{method,headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},body,signal:AbortSignal.timeout(20000)});
            const raw=await r.text();let j;try{j=JSON.parse(raw);}catch{}
            const meta={label,status:r.status,type:r.headers.get('content-type'),codes:j?.errors?.map(e=>({code:e.code,message:e.message})),success:j?.success};
            if(label==='user-token')meta.token=j?.result&&{id:j.result.id,status:j.result.status};
            if(!j)meta.responseKind=/<html/i.test(raw)?'html':raw.slice(0,160);
            console.log(JSON.stringify(meta));return j;
          }
          (async()=>{
            await check('user-token','user/tokens/verify');
            await check('bucket','accounts/'+account+'/r2/buckets/hskkit-page-cache');
            await check('workers-subdomain','accounts/'+account+'/workers/subdomain');
            const key='system/opennext-cache/preflight-'+process.env.GITHUB_RUN_ID+'/rest.cache';
            await check('object-put','accounts/'+account+'/r2/buckets/hskkit-page-cache/objects/'+key,'PUT','cache preflight');
            await check('object-get','accounts/'+account+'/r2/buckets/hskkit-page-cache/objects/'+key);
          })().catch(e=>{console.error(e.name);process.exit(1)});
          NODE
