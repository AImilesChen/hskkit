name: Check dashboard rewards, growth and AI provider

on:
  pull_request:
    branches:
      - fix/review-playback-current-prod-20261004
    paths:
      - ".github/workflows/check-dashboard-ai.yml"
      - ".env.example"
      - "wrangler.jsonc"
      - "src/app/dashboard/dashboard-rewards.tsx"
      - "src/app/dashboard/dashboard-growth.tsx"
      - "src/app/dashboard/dashboard-core.tsx"
      - "src/app/api/v1/dashboard/growth/route.ts"
      - "src/lib/learning/growth.ts"
      - "src/lib/ai/provider.ts"
      - "src/lib/engagement/domain.ts"
      - "tests/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run dashboard growth, badge and AI provider tests
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test tests/dashboard-growth-data.test.mts tests/dashboard-growth-ui.test.mts tests/dashboard-growth-render.test.mts tests/dashboard-stage7-rewards.test.mts tests/step8-ai.test.mts tests/image-mistake-analysis.test.mts
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test --test-name-pattern="Batch 4 AI provider hard timeout|AI provider retries one transient" tests/batch4-pro-ai-loop.test.mts tests/batch13-content-ai-contract.test.mts
      - name: Build
        run: npm run build
      - name: Verify reviewed vocabulary and frozen delivery checksums
        env:
          PRODUCT_IDS: level-6,progression-4-6,advanced-7-9,complete-1-9
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test tests/hsk789-editorial-examples.test.mts tests/hsk789-2025-commercial.test.mts tests/store-sample-versions.test.mts
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/generate-commercial-artifacts.mts "$RUNNER_TEMP/hskkit-reviewed-vocabulary"
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/publish-reviewed-vocabulary-artifacts.mts "$RUNNER_TEMP/hskkit-reviewed-vocabulary" --check-only
