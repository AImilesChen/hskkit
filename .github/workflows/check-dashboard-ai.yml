name: Check dashboard badges and AI provider

on:
  pull_request:
    branches:
      - fix/review-playback-current-prod-20261004
    paths:
      - ".github/workflows/check-dashboard-ai.yml"
      - ".env.example"
      - "wrangler.jsonc"
      - "src/app/dashboard/dashboard-rewards.tsx"
      - "src/lib/ai/provider.ts"
      - "src/lib/engagement/domain.ts"
      - "tests/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run badge and AI provider tests
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test tests/dashboard-stage7-rewards.test.mts tests/step8-ai.test.mts
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test --test-name-pattern="Batch 4 AI provider hard timeout|AI provider retries one transient" tests/batch4-pro-ai-loop.test.mts tests/batch13-content-ai-contract.test.mts
      - name: Build
        run: npm run build
