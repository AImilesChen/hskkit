name: Deploy HSKKit production Worker

on:
  push:
    branches:
      - fix/review-playback-current-prod-20261004
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hskkit-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 77bc392d46985cd3425691358f5e8a77
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check deployment credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing repository secret CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi
      - name: Check storage maintenance protection
        run: node --test tests/storage-maintenance.test.mts tests/storage-build-check.test.mts
      - name: Build and verify pinned vocabulary comparison
        run: |
          python scripts/content/build-hsk-vocabulary-comparison.py
          git diff --exit-code -- src/lib/vocabulary-comparison/manifest.json
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test tests/hsk-vocabulary-comparison.test.mts tests/flashcard-preview.test.mts
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test --test-name-pattern='P0-2 (exposes|grouped|shared|every)' tests/p0-2-discoverable-navigation.test.mts
      - name: Verify HSK 1–6 formal exam contracts
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test tests/formal-exams.test.mts tests/hsk2-formal-exams.test.mts tests/hsk3-formal-exams.test.mts tests/hsk4-formal-exams.test.mts tests/hsk5-formal-exams.test.mts tests/hsk6-formal-exams.test.mts
      - name: Verify AP Chinese publication and protected delivery
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test tests/ap-exams.test.mts
      - name: Verify Chinese 1–4 course publication and protected delivery
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test tests/course-exams.test.mts tests/chinese2-course-exams.test.mts tests/chinese2-timing.test.mts tests/chinese3-course-exams.test.mts tests/chinese3-timing.test.mts tests/chinese4-course-exams.test.mts tests/chinese4-timing.test.mts
      - name: Verify stateless account fast path keeps authenticated paths unchanged
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test tests/anonymous-account-fast-path.test.mts
      - name: Verify lightweight authentication, session security and OAuth behavior
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test tests/account-authentication.test.mts tests/google-sign-in-flow.test.mts tests/account-sync.test.mts tests/account-loading-resilience.test.mts tests/d1-overload-hardening.test.mts tests/p1-user-d1-protection.test.mts tests/p0-3-unified-account-contract.test.mts
      - name: Verify bounded word prebuild and retained word routing
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test tests/word-cache-release.test.mts tests/word-detail-lightweight-data.test.mts tests/dictionary-p2-learning-loop.test.mts
      - name: Ensure dedicated private page-cache bucket
        run: node scripts/storage-release.mjs ensure-bucket
      - name: Check whether assessment delivery changed
        id: assessment
        run: |
          old_version=$(git show HEAD^:src/lib/commercial/products.ts | sed -n 's/^export const PRACTICE_ASSESSMENT_GENERATION_VERSION="\([^"]*\)";.*/\1/p')
          new_version=$(sed -n 's/^export const PRACTICE_ASSESSMENT_GENERATION_VERSION="\([^"]*\)";.*/\1/p' src/lib/commercial/products.ts)
          if [ -z "$old_version" ] || [ -z "$new_version" ]; then
            echo "Assessment version could not be checked" >&2
            exit 1
          fi
          if [ "$old_version" != "$new_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate current assessment delivery
        if: steps.assessment.outputs.changed == 'true'
        env:
          PRODUCT_ID: practice-assessment-pack
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/generate-commercial-artifacts.mts "$RUNNER_TEMP/hskkit-commercial-artifacts"
      - name: Publish assessment delivery before deploying its catalog version
        if: steps.assessment.outputs.changed == 'true'
        run: |
          artifact="$RUNNER_TEMP/hskkit-commercial-artifacts/practice-guided-edition-v4/practice-assessment-pack"
          key="hskkit-commercial-exports/system/artifacts/practice-guided-edition-v4/practice-assessment-pack/product"
          npx wrangler r2 object put "$key.zip" --file "$artifact/product.zip" --content-type application/zip --remote
          npx wrangler r2 object put "$key.manifest.json" --file "$artifact/product.manifest.json" --content-type application/json --remote
      - name: Verify publication record for the already uploaded vocabulary deliveries
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-reviewed-vocabulary-publication.mts
      - name: Build Worker
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
          node scripts/patch-open-next-email.mjs
      - name: Verify cached public pages bypass Next and paid files remain guarded
        timeout-minutes: 7
        run: |
          node --test tests/cache-gate-runner.test.cjs
          node scripts/run-cache-gate.cjs
      - name: Upload and deploy Worker version
        run: |
          npx wrangler versions upload | tee "$RUNNER_TEMP/worker-upload.log"
          version_id=$(grep -Eo 'Worker Version ID: [0-9a-f-]{36}' "$RUNNER_TEMP/worker-upload.log" | tail -1 | awk '{print $4}')
          if [ -z "$version_id" ]; then
            echo "Wrangler did not return a Worker version ID" >&2
            exit 1
          fi
          npx wrangler versions deploy "$version_id@100%" --yes
          echo "STORAGE_WORKER_VERSION=$version_id" >> "$GITHUB_ENV"
      - name: Deploy export-only maintenance without changing queue or cron settings
        run: |
          npx wrangler versions upload --config wrangler.commercial-worker.jsonc --keep-vars --var "STORAGE_CACHE_CLEANUP_MODE:disabled" | tee "$RUNNER_TEMP/storage-worker-upload.log"
          storage_version_id=$(grep -Eo 'Worker Version ID: [0-9a-f-]{36}' "$RUNNER_TEMP/storage-worker-upload.log" | tail -1 | awk '{print $4}')
          if [ -z "$storage_version_id" ]; then
            echo "Wrangler did not return a storage Worker version ID" >&2
            exit 1
          fi
          npx wrangler versions deploy "$storage_version_id@100%" --config wrangler.commercial-worker.jsonc --yes
      - name: Verify storage bindings and existing schedule
        run: node scripts/storage-release.mjs verify-disabled "$RUNNER_TEMP/storage-after-deploy.json"
      - name: Verify comparison delivery and existing tools
        run: python3 scripts/check-comparison-release.py
      - name: Read-only CPU and cache report after healthy deployment
        run: python3 scripts/audit-cf-costs.py "$RUNNER_TEMP/cost-cache-audit.json"
      - name: Retain bounded CPU and cache report
        uses: actions/upload-artifact@v4
        with:
          name: cost-cache-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/cost-cache-audit.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain storage deployment verification
        uses: actions/upload-artifact@v4
        with:
          name: storage-after-deploy-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/storage-after-deploy.json
            storage-comparison-live.json
          retention-days: 7
          if-no-files-found: error

