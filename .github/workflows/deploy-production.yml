name: Deploy HSKKit production Worker

on:
  push:
    branches:
      - fix/review-playback-current-prod-20261004
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hskkit-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 77bc392d46985cd3425691358f5e8a77
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check deployment credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing repository secret CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi
      - name: Check whether assessment delivery changed
        id: assessment
        run: |
          old_version=$(git show HEAD^:src/lib/commercial/products.ts | sed -n 's/^export const PRACTICE_ASSESSMENT_GENERATION_VERSION="\([^"]*\)";.*/\1/p')
          new_version=$(sed -n 's/^export const PRACTICE_ASSESSMENT_GENERATION_VERSION="\([^"]*\)";.*/\1/p' src/lib/commercial/products.ts)
          if [ -z "$old_version" ] || [ -z "$new_version" ]; then
            echo "Assessment version could not be checked" >&2
            exit 1
          fi
          if [ "$old_version" != "$new_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate current assessment delivery
        if: steps.assessment.outputs.changed == 'true'
        env:
          PRODUCT_ID: practice-assessment-pack
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/generate-commercial-artifacts.mts "$RUNNER_TEMP/hskkit-commercial-artifacts"
      - name: Publish assessment delivery before deploying its catalog version
        if: steps.assessment.outputs.changed == 'true'
        run: |
          artifact="$RUNNER_TEMP/hskkit-commercial-artifacts/practice-guided-edition-v4/practice-assessment-pack"
          key="hskkit-commercial-exports/system/artifacts/practice-guided-edition-v4/practice-assessment-pack/product"
          npx wrangler r2 object put "$key.zip" --file "$artifact/product.zip" --content-type application/zip --remote
          npx wrangler r2 object put "$key.manifest.json" --file "$artifact/product.manifest.json" --content-type application/json --remote
      - name: Build Worker
        run: |
          npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
          node scripts/patch-open-next-email.mjs
      - name: Upload and deploy Worker version
        run: |
          npx wrangler versions upload | tee "$RUNNER_TEMP/worker-upload.log"
          version_id=$(grep -Eo 'Worker Version ID: [0-9a-f-]{36}' "$RUNNER_TEMP/worker-upload.log" | tail -1 | awk '{print $4}')
          if [ -z "$version_id" ]; then
            echo "Wrangler did not return a Worker version ID" >&2
            exit 1
          fi
          npx wrangler versions deploy "$version_id@100%" --yes
