name: Deploy HSKKit production Worker

on:
  push:
    branches:
      - fix/review-playback-current-prod-20261004
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hskkit-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 77bc392d46985cd3425691358f5e8a77
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check deployment credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing repository secret CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi
      - name: Build and deploy Worker
        run: npm run deploy
