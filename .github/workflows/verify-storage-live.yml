name: Verify approved storage rollout live
on:
  push:
    branches: [maintenance/r2-storage-optimization-20261106]
    paths: [.github/workflows/verify-storage-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 77bc392d46985cd3425691358f5e8a77
      WRANGLER_SEND_METRICS: "false"
      EXPECTED_BUILD: Uio0kWJQ6kZBYHTBd2FrD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - name: Read actual scheduled aggregate report
        run: node scripts/storage-release.mjs runtime "$RUNNER_TEMP/storage-runtime.json"
      - name: Require a successful scheduled run for the exact published build
        run: |
          node --input-type=module -e '
          import {readFile} from "node:fs/promises";
          import assert from "node:assert/strict";
          const r=JSON.parse(await readFile(process.env.RUNNER_TEMP+"/storage-runtime.json","utf8"));
          assert.equal(r.cache?.schemaVersion,1);
          assert.equal(r.cache?.mode,"apply");
          assert.notEqual(r.cache?.status,"blocked");
          assert.equal(r.cache?.activeBuild,process.env.EXPECTED_BUILD);
          assert.ok(Date.parse(r.cache.checkedAt)>=Date.parse("2026-11-06T15:56:54Z"));
          assert.ok(Date.now()-Date.parse(r.cache.checkedAt)<30*60*1000);
          assert.ok(r.cache.registeredBuilds>=2);
          assert.ok(r.cache.protectedBuilds>=2);
          assert.equal(r.cache.deletedObjects,0);
          assert.equal(r.legacy?.cutoverAt,null);
          assert.equal(r.legacy?.deletedObjects,0);
          console.log("Real scheduled retention run verified for the published build");
          '
      - name: Check public pages and anonymous download protections
        run: python3 scripts/check-storage-live.py --expected-build "$EXPECTED_BUILD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/storage-runtime.json
            storage-production-live-checks.json
          retention-days: 7
          if-no-files-found: error
