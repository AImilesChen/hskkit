name: HSKKit safe R2 page-cache maintenance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cache-maintenance.yml', 'ops/cache-maintenance/**']
  workflow_run:
    workflows: ['Deploy HSKKit production Worker']
    branches: ['fix/review-playback-current-prod-20261004']
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only audit or protected retired-cache cleanup'
        type: choice
        options: [dry-run, apply]
        default: dry-run
      expected_source:
        description: 'Optional expected live production commit SHA'
        type: string
        default: ''
  schedule:
    - cron: '23 0 * * *'
permissions:
  contents: read
concurrency:
  group: hskkit-production-deploy
  cancel-in-progress: false
jobs:
  interval:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.slot.outputs.due }}
      mode: ${{ steps.slot.outputs.mode }}
      expected_source: ${{ steps.slot.outputs.expected_source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify release-trigger and 48-hour fallback rules
        run: node --test ops/cache-maintenance/trigger.test.cjs
      - id: slot
        name: Select successful production releases or the UTC 48-hour slot
        run: node ops/cache-maintenance/trigger.cjs
  cache-maintenance:
    needs: interval
    if: needs.interval.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CACHE_MAINTENANCE_MODE: ${{ needs.interval.outputs.mode }}
      CACHE_MAINTENANCE_EXPECTED_SOURCE: ${{ needs.interval.outputs.expected_source }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run executes only the trusted default-branch maintenance code.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated locked maintenance dependencies
        run: npm ci --prefix ops/cache-maintenance --ignore-scripts --no-audit --no-fund
      - name: Verify deletion safeguards
        run: node --test ops/cache-maintenance/cache-maintenance.test.cjs ops/cache-maintenance/trigger.test.cjs
      - name: Audit or clean only verified retired page-cache versions
        run: node ops/cache-maintenance/cache-maintenance.cjs
      - name: Retain cleanup and unchanged-assets evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-maintenance-${{ github.run_id }}
          path: ${{ runner.temp }}/cache-maintenance-report.json
          retention-days: 14
          if-no-files-found: warn
