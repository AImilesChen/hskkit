name: Complete word-cache release verification
on:
  push:
    branches: [release/word-cache-finalize-20261113]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 77bc392d46985cd3425691358f5e8a77
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/storage-release.mjs
            /scripts/storage-build-check.mjs
            /scripts/check-comparison-release.py
            /scripts/audit-cf-costs.py
            /src/lib/vocabulary-comparison/manifest.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Record independent auxiliary activation failure
        run: echo "Main site version 6f680ffb-af71-4505-9f73-8900236637f3 is active. Auxiliary activation failed twice with Cloudflare 10013; original auxiliary service remains active. No further deployment attempted."
      - name: Verify original auxiliary service has expected bindings and unchanged schedule
        run: node scripts/storage-release.mjs verify-disabled "$RUNNER_TEMP/storage-after-deploy.json"
      - name: Verify already deployed build, public pages and protected tools
        run: |
          mkdir -p .next
          echo L1lm4sqi_HgKDrbDiA96o > .next/BUILD_ID
          python3 scripts/check-comparison-release.py
      - name: Capture read-only CPU and cache storage report
        run: python3 scripts/audit-cf-costs.py "$RUNNER_TEMP/cost-cache-audit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-word-cache-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cost-cache-audit.json
            ${{ runner.temp }}/storage-after-deploy.json
            storage-comparison-live.json
