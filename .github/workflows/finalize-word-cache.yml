name: Complete word-cache release verification
on:
  push:
    branches: [release/word-cache-finalize-20261113]
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 77bc392d46985cd3425691358f5e8a77
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Retry activation of the already uploaded export-only maintenance version
        run: npx wrangler versions deploy 7b2f047a-c7cf-4b3c-8f06-af70084b988e@100% --config wrangler.commercial-worker.jsonc --yes
      - name: Verify storage bindings and unchanged schedule
        run: node scripts/storage-release.mjs verify-disabled "$RUNNER_TEMP/storage-after-deploy.json"
      - name: Verify already deployed build, public pages and protected tools
        run: |
          mkdir -p .next
          echo L1lm4sqi_HgKDrbDiA96o > .next/BUILD_ID
          python3 scripts/check-comparison-release.py
      - name: Capture read-only CPU and cache storage report
        run: python3 scripts/audit-cf-costs.py "$RUNNER_TEMP/cost-cache-audit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-word-cache-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cost-cache-audit.json
            ${{ runner.temp }}/storage-after-deploy.json
            storage-comparison-live.json
