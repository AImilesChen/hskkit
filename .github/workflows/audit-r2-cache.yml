name: Inventory HSKKit R2 cache (read only)

on:
  push:
    branches: [maintenance/r2-cache-audit-20261106]
    paths:
      - scripts/audit-r2-cache.py
      - .github/workflows/audit-r2-cache.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hskkit-r2-readonly-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/audit-r2-cache.py
          sparse-checkout-cone-mode: false
      - name: Inventory metadata only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/audit-r2-cache.py --output "$RUNNER_TEMP/r2-cache-inventory.json"
      - name: Retain bounded metadata report
        uses: actions/upload-artifact@v4
        with:
          name: r2-cache-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/r2-cache-inventory.json
          retention-days: 7
          if-no-files-found: error
