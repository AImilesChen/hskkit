name: Disable added cache maintenance
on:
  push:
    branches: [maintenance/r2-storage-optimization-20261106]
    paths: [.github/workflows/recover-storage-release.yml]
permissions:
  contents: read
concurrency:
  group: hskkit-production-deploy
  cancel-in-progress: false
jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 77bc392d46985cd3425691358f5e8a77
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - name: Verify existing export cleanup protections
        run: |
          node --test tests/storage-maintenance.test.mts tests/storage-build-check.test.mts
          npx tsc --project tsconfig.storage.json --pretty false
          npx eslint workers/commercial-export-worker.ts --max-warnings=0
      - name: Remove added cache cleanup runtime and bucket binding
        run: |
          npx wrangler versions upload --config wrangler.commercial-worker.jsonc --keep-vars --var "STORAGE_CACHE_CLEANUP_MODE:disabled" | tee "$RUNNER_TEMP/storage-worker-upload.log"
          version_id=$(grep -Eo 'Worker Version ID: [0-9a-f-]{36}' "$RUNNER_TEMP/storage-worker-upload.log" | tail -1 | awk '{print $4}')
          test -n "$version_id"
          npx wrangler versions deploy "$version_id@100%" --config wrangler.commercial-worker.jsonc --yes
      - name: Verify cache cleanup disabled and original export schedule retained
        run: node scripts/storage-release.mjs verify-disabled "$RUNNER_TEMP/storage-disabled.json"
      - name: Check unchanged public pages and anonymous download protections
        run: python3 scripts/check-storage-live.py --expected-build Uio0kWJQ6kZBYHTBd2FrD
      - uses: actions/upload-artifact@v4
        with:
          name: storage-disabled-${{ github.run_id }}
          path: ${{ runner.temp }}/storage-disabled.json
          retention-days: 7
          if-no-files-found: error
