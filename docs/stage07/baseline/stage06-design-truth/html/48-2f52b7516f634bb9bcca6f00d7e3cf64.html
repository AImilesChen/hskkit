<script>
        document.addEventListener('DOMContentLoaded', () => {
            const flashcard = document.getElementById('flashcard');
            const ratingControls = document.getElementById('rating-controls');
            let isFlipped = false;

            flashcard.addEventListener('click', () => {
                if (!isFlipped) {
                    flashcard.classList.add('flipped');
                    isFlipped = true;
                    
                    // Reveal controls
                    ratingControls.classList.remove('opacity-30', 'pointer-events-none');
                    ratingControls.classList.add('opacity-100');
                }
            });

            // Handle rating button clicks to simulate moving to next card
            const buttons = ratingControls.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation(); // Prevent card flip toggle
                    
                    // Simulate loading next card
                    flashcard.style.transform = 'translateX(-120%)';
                    flashcard.style.opacity = '0';
                    flashcard.style.transition = 'transform 0.3s ease-in, opacity 0.2s ease-out';
                    
                    setTimeout(() => {
                        // Reset card state
                        flashcard.classList.remove('flipped');
                        isFlipped = false;
                        
                        // Hide controls
                        ratingControls.classList.add('opacity-30', 'pointer-events-none');
                        ratingControls.classList.remove('opacity-100');
                        
                        // Bring card back from right
                        flashcard.style.transition = 'none';
                        flashcard.style.transform = 'translateX(120%)';
                        
                        // Small delay to allow reflow before sliding in
                        setTimeout(() => {
                            flashcard.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease-in';
                            flashcard.style.transform = 'translateX(0)';
                            flashcard.style.opacity = '1';
                        }, 50);
                    }, 300);
                });
            });
        });
    </script>
