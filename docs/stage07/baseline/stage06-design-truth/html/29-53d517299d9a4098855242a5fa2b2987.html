<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Listening Session - HSKKit</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#2563eb",
                        "primary-container": "#1d4ed8",
                        "on-primary": "#ffffff",
                        "background": "#f8fafc",
                        "on-background": "#0f172a",
                        "surface": "#ffffff",
                        "on-surface": "#0f172a",
                        "surface-container": "#f8fafc",
                        "surface-container-low": "#f1f5f9",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e2e8f0",
                        "secondary": "#475569",
                        "outline-variant": "#e2e8f0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.5rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "container-max": "1140px",
                        "gutter": "24px",
                        "margin-desktop": "64px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "h1-mobile": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"],
                        "h1": ["Inter"],
                        "h3": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "h2": ["Inter"]
                    },
                    "fontSize": {
                        "h1-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "h1": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "h3": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "h2": ["32px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased flex flex-col min-h-screen overflow-x-hidden" style="max-width: 390px; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.05);">
<!-- Top App Bar (Task-focused context, hide full nav, show back) -->
<header class="flex justify-between items-center w-full px-margin-mobile h-[64px] border-b border-outline-variant bg-surface sticky top-0 z-50 shrink-0">
<button aria-label="Go Back" class="flex items-center justify-center w-[44px] h-[44px] -ml-2 text-on-background hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-h3 text-h3 font-bold text-on-background truncate flex-1 text-center px-4">HSK 3 - Unit 4</h1>
<button aria-label="Settings" class="flex items-center justify-center w-[44px] h-[44px] -mr-2 text-secondary hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">more_vert</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col relative w-full bg-background">
<!-- Context / Artwork Area -->
<div class="px-margin-mobile py-8 flex flex-col items-center justify-center bg-surface mb-4 border-b border-outline-variant pb-8">
<div class="w-48 h-48 rounded-xl border border-outline-variant shadow-sm overflow-hidden mb-6 bg-surface-container flex items-center justify-center relative">
<img class="object-cover w-full h-full absolute inset-0 mix-blend-multiply opacity-80" data-alt="A minimalist, high-contrast illustration of a traditional Chinese teahouse scene, rendered in a crisp, scholarly style. The color palette focuses on deep navy blues, slate grays, and pristine whites, evoking a calm, focused learning environment consistent with an academic application. The composition is clean and uncluttered, centered within the square frame." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA6CeZDfFm62pSnvaWX30D-AI2MwKXMAov2KZPL0mSN-4oyAh9dmXGBgf5kgmUMDA3_T_oojxuN_hiSfD7gJyVhg1gPDsu0jqDEP8R2Yc5zn3HpDBOypM8YL6LVtCynxDYh6XlAWKWY_CTi29BAJTmIaexc-2-8DxTAflK-roLPv3dGx-tOaUodhbmR3dxs_r7FIBsOyI2U8rEF-Lj_QLdJvc7YVwVeqHay4sYgc5MdQzxQq_gGNY0Afok-D_aiDJezOKmJ5wJ3c94"/>
<span class="material-symbols-outlined text-[64px] text-primary/20 absolute z-10" style="font-variation-settings: 'FILL' 0;">headphones</span>
</div>
<h2 class="font-h2 text-h2 text-on-background text-center mb-2">Dialogue: At the Teahouse</h2>
<p class="font-body-sm text-body-sm text-secondary text-center max-w-[280px]">Listen to the conversation carefully before proceeding to the comprehension drill.</p>
</div>
<!-- Drills/Interaction Area (Empty during initial listening phase) -->
<div class="flex-1 bg-background px-margin-mobile py-6 flex flex-col">
<!-- Space reserved for reading drills or transcripts -->
<div class="w-full flex justify-end mb-4">
<button class="flex items-center gap-2 text-on-background font-body-sm text-body-sm px-4 py-2 border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors min-h-[44px] bg-surface">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">translate</span>
                    Show Transcript
                </button>
</div>
</div>
</main>
<!-- Player Controls (Sticky Bottom) -->
<div class="bg-surface border-t border-outline-variant px-margin-mobile pb-[34px] pt-4 flex flex-col shrink-0 w-full z-40 relative shadow-[0_-4px_16px_rgba(0,0,0,0.02)]">
<!-- Progress Bar -->
<div class="flex items-center gap-3 w-full mb-6">
<span class="font-label-caps text-label-caps text-secondary tabular-nums">01:24</span>
<div class="flex-1 h-1 bg-surface-variant rounded-sm relative cursor-pointer group">
<!-- Track background -->
<div class="absolute inset-0 bg-surface-variant rounded-sm"></div>
<!-- Progress -->
<div class="absolute left-0 top-0 bottom-0 w-[45%] bg-primary rounded-sm"></div>
<!-- Scrubber Handle -->
<div class="absolute left-[45%] top-1/2 -translate-y-1/2 -translate-x-1/2 w-3 h-3 bg-primary rounded-full shadow-sm scale-0 group-hover:scale-100 transition-transform"></div>
</div>
<span class="font-label-caps text-label-caps text-secondary tabular-nums">03:15</span>
</div>
<!-- Primary Controls -->
<div class="flex items-center justify-between w-full mb-4">
<button aria-label="Rewind 15 seconds" class="flex items-center justify-center w-[44px] h-[44px] text-secondary hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 0;">replay_10</span>
</button>
<button aria-label="Pause" class="flex items-center justify-center w-[64px] h-[64px] bg-primary text-on-primary rounded-full shadow-sm hover:bg-primary-container active:scale-95 transition-all">
<span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button aria-label="Forward 15 seconds" class="flex items-center justify-center w-[44px] h-[44px] text-secondary hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 0;">forward_10</span>
</button>
</div>
<!-- Secondary Actions Row -->
<div class="flex justify-between items-center w-full mt-2 pt-4 border-t border-outline-variant/50">
<button class="flex items-center gap-2 text-secondary hover:text-primary transition-colors font-label-caps text-label-caps min-h-[44px] px-2">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">flag</span>
                REPORT ISSUE
            </button>
<button class="flex items-center gap-2 text-secondary hover:text-primary transition-colors font-label-caps text-label-caps font-semibold min-h-[44px] px-2">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">replay</span>
                RETRY
            </button>
</div>
</div>
</body></html>
